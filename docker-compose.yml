services:
  proxy:
    build: .
    restart: always
    ports:
      - "127.0.0.1:${COPILOT_PROXY_PORT:-18080}:18080"
    volumes:
      - type: bind
        source: "${COPILOT_AUTH_FILE:?Set COPILOT_AUTH_FILE to the host OAuth credential file}"
        target: /run/secrets/copilot-auth.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${COPILOT_PROXY_KEY_FILE:?Set COPILOT_PROXY_KEY_FILE to the host local API key file}"
        target: /run/secrets/copilot-proxy-key.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      COPILOT_PROXY_HOST: "0.0.0.0"
      COPILOT_PROXY_PORT: "18080"
      COPILOT_AUTH_FILE: /run/secrets/copilot-auth.json
      COPILOT_PROXY_KEY_FILE: /run/secrets/copilot-proxy-key.json
      COPILOT_TRANSPORT: "${COPILOT_TRANSPORT:-auto}"
      COPILOT_MAX_BODY_BYTES: "${COPILOT_MAX_BODY_BYTES:-33554432}"
      COPILOT_MAX_RESPONSE_BYTES: "${COPILOT_MAX_RESPONSE_BYTES:-67108864}"
      COPILOT_MAX_SSE_EVENT_BYTES: "${COPILOT_MAX_SSE_EVENT_BYTES:-8388608}"
      COPILOT_REQUEST_TIMEOUT_MS: "${COPILOT_REQUEST_TIMEOUT_MS:-120000}"
      COPILOT_MAX_RETRIES: "${COPILOT_MAX_RETRIES:-3}"
      COPILOT_RETRY_BUDGET_MS: "${COPILOT_RETRY_BUDGET_MS:-30000}"
      COPILOT_MIN_REQUEST_INTERVAL_MS: "${COPILOT_MIN_REQUEST_INTERVAL_MS:-0}"
      COPILOT_MAX_CONCURRENT_REQUESTS: "${COPILOT_MAX_CONCURRENT_REQUESTS:-0}"
      COPILOT_MAX_QUEUED_REQUESTS: "${COPILOT_MAX_QUEUED_REQUESTS:-64}"
      COPILOT_MAX_QUEUE_BYTES: "${COPILOT_MAX_QUEUE_BYTES:-67108864}"
      COPILOT_QUEUE_TIMEOUT_MS: "${COPILOT_QUEUE_TIMEOUT_MS:-30000}"
      COPILOT_MODEL_CACHE_TTL_MS: "${COPILOT_MODEL_CACHE_TTL_MS:-300000}"
      COPILOT_MODEL_CACHE_MAX_STALE_MS: "${COPILOT_MODEL_CACHE_MAX_STALE_MS:-3600000}"
      COPILOT_MODEL_REQUEST_TIMEOUT_MS: "${COPILOT_MODEL_REQUEST_TIMEOUT_MS:-3000}"
      COPILOT_HEARTBEAT_INTERVAL_MS: "${COPILOT_HEARTBEAT_INTERVAL_MS:-15000}"
      COPILOT_FORWARD_REASONING: "${COPILOT_FORWARD_REASONING:-1}"
      COPILOT_LOG_SEARCH_QUERIES: "${COPILOT_LOG_SEARCH_QUERIES:-0}"
      COPILOT_EDITOR_VERSION: "${COPILOT_EDITOR_VERSION:-vscode/1.99.0}"
      COPILOT_INTEGRATION_ID: "${COPILOT_INTEGRATION_ID:-vscode-chat}"
      WEBSEARCH_PROVIDER: "${WEBSEARCH_PROVIDER:-}"
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      SERPER_API_KEY: "${SERPER_API_KEY:-}"
      EXA_API_KEY: "${EXA_API_KEY:-}"
      PARALLEL_API_KEY: "${PARALLEL_API_KEY:-}"
      WEB_SEARCH_MAX_RESULTS: "${WEB_SEARCH_MAX_RESULTS:-5}"
      WEB_SEARCH_MAX_USES_CAP: "${WEB_SEARCH_MAX_USES_CAP:-10}"
      WEB_SEARCH_TIMEOUT_MS: "${WEB_SEARCH_TIMEOUT_MS:-25000}"
      WEB_SEARCH_MAX_RESPONSE_BYTES: "${WEB_SEARCH_MAX_RESPONSE_BYTES:-2097152}"
      WEB_SEARCH_MAX_CONCURRENT: "${WEB_SEARCH_MAX_CONCURRENT:-2}"
      WEB_SEARCH_CACHE_TTL_MS: "${WEB_SEARCH_CACHE_TTL_MS:-300000}"
      WEB_SEARCH_CACHE_MAX_ENTRIES: "${WEB_SEARCH_CACHE_MAX_ENTRIES:-500}"
      WEB_SEARCH_CACHE_MAX_BYTES: "${WEB_SEARCH_CACHE_MAX_BYTES:-16777216}"
      WEB_SEARCH_MAX_QUERY_BYTES: "${WEB_SEARCH_MAX_QUERY_BYTES:-8192}"
